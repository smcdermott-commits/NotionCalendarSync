name: Notion Calendar Sync

on:
  schedule:
    - cron: '0 */10 * * *'

  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create environment file
        run: |
          echo "NOTION_TOKEN=${{ secrets.NOTION_TOKEN }}" >> .env
          echo "DEADLINES_DATABASE_ID=${{ secrets.DEADLINES_DATABASE_ID }}" >> .env
          echo "COURSES_DATABASE_ID=${{ secrets.COURSES_DATABASE_ID }}" >> .env
          echo "GOOGLE_CALENDAR_ID=${{ secrets.GOOGLE_CALENDAR_ID }}" >> .env

      - name: Create Google credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json
          echo '${{ secrets.GOOGLE_TOKEN_JSON }}' > token.json

      - name: Run sync
        run: |
          python sync.py
